<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site-89 Launcher</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>Site-89 Launcher</h1>
      <p>Desktop prototype for install, update, and launch flow</p>
    </header>

    <section class="panel">
      <div class="actions">
        <button id="installBtn" class="primary" type="button">Install / Update Modpack</button>
        <button id="playBtn" class="secondary" type="button">Play</button>
        <button id="openFolderBtn" class="ghost" type="button">Open Modpack Folder</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">Starting launcher...</div>

      <div class="progress-wrap" aria-live="polite">
        <div class="progress-head">
          <span id="progressPhase">Idle</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="progressDetail" class="progress-detail">Waiting for action...</div>
      </div>

      <div class="meta">
        <div><strong>Install Root:</strong> <span id="installRoot">-</span></div>
        <div><strong>Modpack URL:</strong> <span id="modpackUrl">-</span></div>
      </div>
    </section>

    <section class="panel compact">
      <h2>Protocol Support</h2>
      <p>This app registers <code>site89://</code> links. Website buttons can call:</p>
      <ul>
        <li><code>site89://install?pack=main</code></li>
        <li><code>site89://play?pack=main</code></li>
      </ul>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
