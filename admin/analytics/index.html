<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Editor - Admin Panel</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/analytics.css">

  <script type="module">
    import { ThemeManager } from '/assets/js/theme.js';
    ThemeManager.init();
  </script>

  <style>
    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: var(--font-body);
    }

    .editor-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      padding-top: 120px;
    }

    .editor-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid rgba(78, 250, 170, 0.2);
    }

    .editor-header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #4efaaa 0%, #00ff7f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .editor-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(78, 250, 170, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .editor-section h2 {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(78, 250, 170, 0.2);
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4efaaa;
      background: rgba(78, 250, 170, 0.05);
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .item-row {
      display: flex;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 1rem;
      border-radius: 8px;
      align-items: center;
    }

    .item-row input {
      flex: 1;
    }

    .item-row button {
      padding: 0.5rem 0.75rem;
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid rgba(255, 107, 107, 0.4);
      color: #ff6b6b;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .item-row button:hover {
      background: rgba(255, 107, 107, 0.3);
    }

    .btn-add-item {
      width: 100%;
      padding: 0.75rem;
      background: rgba(78, 250, 170, 0.1);
      border: 1px solid rgba(78, 250, 170, 0.3);
      color: #4efaaa;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-add-item:hover {
      background: rgba(78, 250, 170, 0.2);
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-save, .btn-cancel {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-save {
      background: linear-gradient(135deg, #4efaaa 0%, #00ff7f 100%);
      color: #0a0a0b;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(78, 250, 170, 0.3);
    }

    .btn-cancel {
      background: rgba(78, 250, 170, 0.1);
      border: 1px solid rgba(78, 250, 170, 0.3);
      color: #4efaaa;
    }

    .btn-cancel:hover {
      background: rgba(78, 250, 170, 0.2);
    }

    .success-message {
      padding: 1rem;
      background: rgba(78, 250, 170, 0.1);
      border-left: 4px solid #4efaaa;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    @media (max-width: 768px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }

      .item-row {
        flex-direction: column;
      }

      .item-row input {
        width: 100%;
      }

      .item-row button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <script>
    document.getElementById('navbar-container').innerHTML = '<div id="includeNavbar"></div>';
  </script>
  <div id="includeNavbar" data-include="/components/navbar.html"></div>
  <script src="/assets/js/include.js"></script>

  <main class="editor-container">
    <div id="accessDenied" class="access-denied-message" style="display: none;">
      <div class="access-denied-card">
        <i class="fa-solid fa-lock"></i>
        <h2>Access Restricted</h2>
        <p>This page is for authorized administrators only.</p>
        <a href="/" class="btn-back">Return to Home</a>
      </div>
    </div>

    <div id="editorContent" style="display: none;">
      <div class="editor-header">
        <h1>Analytics Data Editor</h1>
        <p class="header-subtitle">Manage finance data and analytics settings</p>
      </div>

      <div class="success-message" id="successMessage">
        <i class="fa-solid fa-check-circle"></i>
        <span id="successText">Data saved successfully!</span>
      </div>

      <div class="editor-grid">
        <!-- Finance Section -->
        <div class="editor-section">
          <h2>Monthly Site Upkeep Costs</h2>
          <div class="items-list" id="upkeepList"></div>
          <button class="btn-add-item" onclick="addUpkeepMonth()">
            <i class="fa-solid fa-plus"></i> Add Month
          </button>
        </div>

        <!-- Founder Contributions -->
        <div class="editor-section">
          <h2>Founder Contributions</h2>
          <div class="items-list" id="contributionsList"></div>
          <button class="btn-add-item" onclick="addContributor()">
            <i class="fa-solid fa-plus"></i> Add Founder
          </button>
        </div>
      </div>

      <div class="editor-grid">
        <!-- Monthly Budget Total -->
        <div class="editor-section">
          <h2>Budget Settings</h2>
          <form id="budgetForm">
            <div class="form-group">
              <label for="totalBudget">Total Monthly Budget ($)</label>
              <input type="number" id="totalBudget" min="0" step="0.01" required>
            </div>
          </form>
        </div>

        <!-- Additional Notes -->
        <div class="editor-section">
          <h2>Finance Notes</h2>
          <form id="notesForm">
            <div class="form-group">
              <label for="financeNotes">Additional Notes</label>
              <textarea id="financeNotes" rows="5" placeholder="Add any additional notes about finances..."></textarea>
            </div>
          </form>
        </div>
      </div>

      <div class="editor-section" style="grid-column: 1 / -1;">
        <div class="button-group">
          <button class="btn-save" onclick="saveFinanceData()">
            <i class="fa-solid fa-save"></i> Save All Changes
          </button>
          <button class="btn-cancel" onclick="window.location.href='/analytics/'">
            <i class="fa-solid fa-arrow-left"></i> Back to Analytics
          </button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/assets/js/auth.js"></script>
  <script type="module" src="/assets/js/analytics-editor.js"></script>
</body>
</html>
