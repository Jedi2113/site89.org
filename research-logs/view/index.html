<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="/assets/js/secure-access.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="required-clearance" content="1">
  <title>Research Log - Site-89</title>
  <meta name="description" content="View Site-89 research log details and clearance-filtered content.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Site-89">
  <meta property="og:title" content="Research Log - Site-89">
  <meta property="og:description" content="View Site-89 research log details and findings.">
  <meta property="og:url" content="https://site89.github.io/research-logs/view/">
  <meta property="og:image" content="https://site89.github.io/assets/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Research Log - Site-89">
  <meta name="twitter:description" content="View Site-89 research log details and findings.">
  <meta name="twitter:image" content="https://site89.github.io/assets/img/og-image.png">
  <link rel="canonical" href="https://site89.github.io/research-logs/view/">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="module">
    import { ThemeManager } from '/assets/js/theme.js';
    ThemeManager.init();
  </script>
  <style>
    .rlv-shell{max-width:1100px;margin:1.5rem auto;padding:0 1rem 2rem}
    .rlv-back{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--accent-teal);font-weight:700;margin-bottom:1rem}
    .rlv-card{background:var(--bg-card);border:1px solid rgba(78,250,170,.18);border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.24)}
    .rlv-head{padding:1.2rem;border-bottom:1px solid rgba(78,250,170,.14);background:linear-gradient(135deg, rgba(78,250,170,.08), rgba(0,124,107,.05))}
    .rlv-id{font-family:var(--font-mono);color:var(--accent-teal);font-size:.84rem;text-transform:uppercase;letter-spacing:.08em}
    .rlv-title{margin:.35rem 0 0;font-size:1.9rem;line-height:1.2;color:var(--accent-mint)}
    .rlv-meta{margin:.6rem 0 0;color:var(--text-light);opacity:.92}
    .rlv-body{padding:1.2rem;display:grid;gap:1rem}
    .rlv-section{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:1rem}
    .rlv-section h2{margin:0 0 .6rem;color:var(--accent-mint);font-size:1.1rem}
    .rlv-tags{display:flex;flex-wrap:wrap;gap:.45rem}
    .rlv-pill{display:inline-flex;align-items:center;padding:.24rem .55rem;border-radius:999px;font-size:.84rem;border:1px solid rgba(78,250,170,.2);background:rgba(78,250,170,.08);color:var(--accent-teal);text-decoration:none}
    .rlv-markdown{line-height:1.7}
    .rlv-empty{color:var(--text-light);opacity:.84;font-style:italic}
    .rlv-message{padding:2rem 1rem;text-align:center;color:var(--text-light)}
  </style>
</head>
<body>
  <div data-include="/components/header.html"></div>
  <div data-include="/components/navbar.html"></div>
  <main class="rlv-shell">
    <a class="rlv-back" href="/research-logs/">Back to Research Logs</a>
    <section id="researchLogView" class="rlv-card" style="display:none;">
      <header class="rlv-head">
        <div id="rlvId" class="rlv-id">Research Log</div>
        <h1 id="rlvTitle" class="rlv-title">Loading...</h1>
        <p id="rlvMeta" class="rlv-meta"></p>
      </header>
      <div class="rlv-body">
        <section class="rlv-section">
          <h2>Tags</h2>
          <div id="rlvTags" class="rlv-tags"></div>
        </section>
        <section class="rlv-section">
          <h2>Linked Items</h2>
          <div id="rlvLinked" class="rlv-tags"></div>
        </section>
        <section class="rlv-section">
          <h2>Content</h2>
          <div id="rlvContent" class="rlv-markdown"></div>
        </section>
      </div>
    </section>
    <section id="researchLogMessage" class="rlv-card">
      <div id="rlvMessageText" class="rlv-message">Loading research log...</div>
    </section>
  </main>
  <div data-include="/components/footer.html"></div>
  <script src="/assets/js/include.js"></script>
  <script type="module" src="/assets/js/auth.js"></script>
  <script type="module" src="/assets/js/research-log-view.js"></script>
</body>
</html>
